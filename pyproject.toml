[project]
name = "fleet-review"
version = "0.1.0"
description = "Advisory local report of what a change introduced (duplication and complexity) for Go and Python repos."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rob Knight" }]
requires-python = ">=3.11"
dependencies = ["lizard==1.25.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
fleet-review = "fleet_review.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
